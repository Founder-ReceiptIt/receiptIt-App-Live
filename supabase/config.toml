[functions.inbound-email]
# Resend cannot supply a Supabase JWT. The function verifies the raw Svix
# signature and five-minute timestamp before reading any message data.
verify_jwt = false

[functions.delete-receipt]
# Owner requests are verified with Auth.getUser and deleted under their own JWT.
# Scheduled cleanup has a separate narrow credential and cannot delete rows.
verify_jwt = false

[functions.access-code-event]
# The existing public project JWT plus a signed telemetry token allow intro events.
# Wallet events additionally verify the user's JWT with Auth.getUser.
verify_jwt = true

[auth]
# Password recovery and other Auth links must return to the live ReceiptIt app.
site_url = "https://www.receiptit.app"
additional_redirect_urls = [
  "https://www.receiptit.app/**",
  "https://receiptit.app/**",
  "http://localhost:3000/**",
  "http://localhost:5173/**",
]

[auth.email]
# Preserve the production anti-abuse and OTP settings that pre-date this change.
max_frequency = "1m0s"
otp_length = 8

[auth.mfa.totp]
# Preserve the production TOTP capability; the redirect fix must not weaken MFA.
enroll_enabled = true
verify_enabled = true
