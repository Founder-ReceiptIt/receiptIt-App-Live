<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>receiptIt · How it works</title><style>html,body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif}main{max-width:390px;margin:auto;padding:0}receiptit-story{display:block;width:100%}.controls{display:flex;gap:12px;justify-content:center;padding:16px}button{min-height:44px;border:1px solid #345345;border-radius:8px;background:#10271d;color:#5eead4;padding:8px 16px}</style><main><receiptit-story id="story"></receiptit-story><div class="controls"><button id="pause">Pause</button><button id="replay" hidden>Replay</button></div></main><script type="module">import{fontsReady}from './receiptit-story.js?v=9';const s=document.querySelector('#story'),q=new URLSearchParams(location.search);if(q.get('mode')==='static')s.setAttribute('mode','static');window.animationReady=fontsReady;await fontsReady;if(q.has('time'))s.seek(Number(q.get('time')));document.querySelector('#pause').onclick=()=>s.paused?s.play():s.pause();document.querySelector('#replay').onclick=()=>s.replay();const sync=()=>{document.querySelector('#replay').hidden=!s.completed;document.querySelector('#pause').hidden=s.completed||s.staticMode;document.querySelector('#pause').textContent=s.paused?'Play':'Pause';};s.addEventListener('playstatechange',sync);sync();</script></html>
